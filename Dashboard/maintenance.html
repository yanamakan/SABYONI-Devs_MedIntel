 <!-- This is what the doctors and nurses and the admins and possible patients will see when they log into the system diriong down time -->

 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MedIntel — System Maintenance</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
    }
    .box {
      max-width: 480px;
      padding: 48px 40px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
    }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
    p { font-size: 15px; color: #94a3b8; line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 20px;
      background: rgba(239,68,68,0.2);
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🔧</div>
    <h1>System Under Maintenance</h1>
    <p>MedIntel is currently undergoing scheduled maintenance. Please check back shortly. Contact your system administrator if this persists.</p>
    <div class="badge">● System Offline</div>
  </div>
</body>
</html>
