<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MedIntel — Two-Factor Authentication</title>
  <link rel="stylesheet" href="login.css"/>
  <style>
    .otp-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 36px;
      max-width: 400px;
      margin: 80px auto;
      backdrop-filter: blur(12px);
      text-align: center;
    }
    .otp-card h2 { color:#fff; margin:0 0 8px; font-size:22px; }
    .otp-card p.sub { color:#94a3b8; font-size:14px; margin:0 0 28px; }
    .lock-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .otp-input-wrapper {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0 28px;
    }
    .otp-input-wrapper input {
      width: 50px;
      height: 58px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff;
      transition: border-color 0.2s;
    }
    .otp-input-wrapper input:focus { outline:none; border-color:#3b82f6; }
    .btn-primary {
      width: 100%;
      padding: 13px;
      background: #1e3a5f;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #2d5a9e; }
    .btn-link {
      background: none;
      border: none;
      color: #3b82f6;
      font-size: 13px;
      cursor: pointer;
      margin-top: 14px;
      display: block;
      width: 100%;
    }
    #otpMessage {
      font-size: 14px;
      margin-top: 14px;
      min-height: 20px;
    }
    .timer { color:#94a3b8; font-size:13px; margin-top:10px; }
  </style>
</head>
<body>

  <header>
    <div class="logo-wrapper">
      <div class="logo-icon">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="38" height="38">
          <line x1="12" y1="8" x2="12" y2="14" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="28" y1="8" x2="28" y2="14" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M12 14 Q12 20 20 20 Q28 20 28 14" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <line x1="20" y1="20" x2="20" y2="26" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="20" cy="30" r="4" stroke="white" stroke-width="2.5" fill="none"/>
          <circle cx="20" cy="30" r="1.2" fill="white"/>
        </svg>
      </div>
      <div class="logo-text">
        <h1>MedIntel</h1>
        <p class="tagline">Intelligent Medical Support</p>
      </div>
    </div>
  </header>

  <div class="otp-card">
    <div class="lock-icon">🔐</div>
    <h2>Two-Factor Authentication</h2>
    <p class="sub">A 6-digit verification code was sent to<br/><strong id="emailDisplay" style="color:#cbd5e1;"></strong></p>

    <div class="otp-input-wrapper">
      <input type="text" maxlength="1" class="otp-digit" oninput="otpAutoTab(this, 0)" onkeydown="otpBackspace(event, 0)"/>
      <input type="text" maxlength="1" class="otp-digit" oninput="otpAutoTab(this, 1)" onkeydown="otpBackspace(event, 1)"/>
      <input type="text" maxlength="1" class="otp-digit" oninput="otpAutoTab(this, 2)" onkeydown="otpBackspace(event, 2)"/>
      <input type="text" maxlength="1" class="otp-digit" oninput="otpAutoTab(this, 3)" onkeydown="otpBackspace(event, 3)"/>
      <input type="text" maxlength="1" class="otp-digit" oninput="otpAutoTab(this, 4)" onkeydown="otpBackspace(event, 4)"/>
      <input type="text" maxlength="1" class="otp-digit" oninput="otpAutoTab(this, 5)" onkeydown="otpBackspace(event, 5)"/>
    </div>

    <button class="btn-primary" onclick="verifyOTP()">Verify & Login</button>
    <button class="btn-link" onclick="resendOTP()">Resend code</button>
    <div class="timer" id="timerDisplay"></div>
    <div id="otpMessage"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../Scripts/config.js"></script>

  <script>
    const API_BASE = "https://sabyoni-devs-med-intel.vercel.app";
    const email = sessionStorage.getItem("twofa_email");
    const redirectPage = sessionStorage.getItem("twofa_redirect");

    let countdown = 300; // 5 minutes
    let timerInterval;

    document.getElementById("emailDisplay").textContent = email || "your email";

    // Guard — if no email in session, go back to login
    if (!email) window.location.href = "login.html";

    startTimer();

    function startTimer() {
      clearInterval(timerInterval);
      countdown = 300;
      timerInterval = setInterval(() => {
        countdown--;
        const m = Math.floor(countdown / 60);
        const s = countdown % 60;
        document.getElementById("timerDisplay").textContent =
          `Code expires in ${m}:${s.toString().padStart(2, "0")}`;
        if (countdown <= 0) {
          clearInterval(timerInterval);
          document.getElementById("timerDisplay").textContent = "Code expired. Please resend.";
        }
      }, 1000);
    }

    function showMsg(text, type) {
      const el = document.getElementById("otpMessage");
      const colors = { error: "#ef4444", info: "#3b82f6", success: "#16a34a" };
      el.style.cssText = `color:${colors[type]};font-size:14px;margin-top:12px;`;
      el.textContent = text;
    }

    function otpAutoTab(input, index) {
      input.value = input.value.replace(/[^0-9]/g, "");
      const digits = document.querySelectorAll(".otp-digit");
      if (input.value && index < 5) digits[index + 1].focus();
    }

    function otpBackspace(event, index) {
      const digits = document.querySelectorAll(".otp-digit");
      if (event.key === "Backspace" && !digits[index].value && index > 0) {
        digits[index - 1].focus();
      }
    }

    async function verifyOTP() {
      const digits = document.querySelectorAll(".otp-digit");
      const otp = Array.from(digits).map(d => d.value).join("");

      if (otp.length !== 6) { showMsg("Please enter all 6 digits.", "error"); return; }

      showMsg("Verifying...", "info");

      const res = await fetch(`${API_BASE}/api/email`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "verify_otp", email, otp, otp_type: "2fa" }),
      });
      const data = await res.json();

      if (data.success) {
        clearInterval(timerInterval);
        sessionStorage.removeItem("twofa_email");
        sessionStorage.removeItem("twofa_redirect");
        showMsg("Verified! Redirecting...", "success");
        setTimeout(() => window.location.href = redirectPage || "login.html", 1000);
      } else {
        showMsg(data.error || "Invalid code. Try again.", "error");
      }
    }

    async function resendOTP() {
      showMsg("Resending code...", "info");
      const res = await fetch(`${API_BASE}/api/email`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "2fa", email }),
      });
      const data = await res.json();
      if (data.success) {
        showMsg("New code sent!", "success");
        startTimer();
        document.querySelectorAll(".otp-digit").forEach(d => d.value = "");
        document.querySelectorAll(".otp-digit")[0].focus();
      } else {
        showMsg("Failed to resend. Try again.", "error");
      }
    }
  </script>
</body>
</html>
