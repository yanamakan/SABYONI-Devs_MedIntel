<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointments – Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <div class="logo">&#9881;</div>
      <div class="header-info">
        <h1>Admin Dashboard</h1>
        <span>Hospital System Administrator &amp; Appointment Management</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="header-btn">&#128276; Notifications <span class="notif-dot">2</span></button>
      <button class="header-btn">&#8594; Logout</button>
    </div>
  </header>

  <!-- TABS -->
  <div class="main">
    <div class="tabs-bar">
      <nav class="tabs">
        <a href="admin-doctors.html"      class="tab">Doctors (2)</a>
        <a href="admin-nurses.html"       class="tab">Nurses (2)</a>
        <a href="admin-appointments.html" class="tab active">Appointments (5)</a>
        <a href="admin-queue.html"        class="tab">Patient Queue</a>
      </nav>
      <button class="btn btn-blue" onclick="openModal()">&#43; Add Staff Member</button>
    </div>

    <!-- CONTENT -->
    <div class="section-card">
      <div class="section-header">
        <div>
          <h2 class="section-title">Appointment Management</h2>
          <p class="section-sub">View, confirm, and manage all appointments</p>
        </div>
        <button class="btn btn-purple" onclick="openScheduleModal()">
          &#128197; Schedule Appointment
        </button>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Urgency</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="appointmentBody"></tbody>
      </table>
    </div>
  </div>

  <!-- SCHEDULE APPOINTMENT MODAL -->
  <div class="modal hidden" id="scheduleModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Schedule Appointment</h3>
        <button class="modal-close" onclick="closeScheduleModal()">&times;</button>
      </div>
      <div class="form-grid">
        <div>
          <label>Patient Name *</label>
          <input type="text" id="apptPatient" placeholder="Full name" />
          <small class="error" id="apptPatientError"></small>
        </div>
        <div>
          <label>Doctor *</label>
          <select id="apptDoctor">
            <option value="">Select Doctor</option>
            <option>Dr. Michael Chen</option>
            <option>Dr. Emily Rodriguez</option>
          </select>
          <small class="error" id="apptDoctorError"></small>
        </div>
        <div>
          <label>Date *</label>
          <input type="date" id="apptDate" />
          <small class="error" id="apptDateError"></small>
        </div>
        <div>
          <label>Time *</label>
          <input type="time" id="apptTime" />
        </div>
        <div>
          <label>Urgency</label>
          <select id="apptUrgency">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-purple" onclick="scheduleAppointment()">&#128197; Schedule</button>
        <button class="btn btn-outline" onclick="closeScheduleModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="admin-appointments.js"></script>
</body>
</html>
