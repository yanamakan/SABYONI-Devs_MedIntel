<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nurse Dashboard</title>
  <link rel="stylesheet" href="nurse.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
    </div>
    <div class="header-info">
      <h1>Nurse Dashboard</h1>
      <span>Alice Williams &bull; Emergency Department</span>
    </div>
    <div class="header-actions">
      <button class="header-btn">
        &#128276; Notifications <span class="notif-dot">2</span>
      </button>
      <button class="header-btn">&#8594; Logout</button>
    </div>
  </header>

  <!-- STATS -->
  <div class="main">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Patients Today</div>
        <div class="stat-num">15</div>
        <div class="stat-sub">+3 since morning</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending Diagnoses</div>
        <div class="stat-num">3</div>
        <div class="stat-sub">Awaiting approval</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Alerts</div>
        <div class="stat-num alert-num">2</div>
        <div class="stat-sub">Needs attention</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Tasks Completed</div>
        <div class="stat-num green-num">12</div>
        <div class="stat-sub">Today</div>
      </div>
    </div>

    <!-- NAV TABS -->
    <nav class="tabs">
      <a href="pending-diagnoses.html" class="tab">Pending Diagnoses</a>
      <a href="patient-care.html"      class="tab">Patient Care</a>
      <a href="vital-signs.html"       class="tab">Vital Signs</a>
      <a href="schedule.html"          class="tab">Schedule</a>
    </nav>

  </div><!-- /main -->

  <script src="nurse-dashboard.js"></script>
</body>
</html>
